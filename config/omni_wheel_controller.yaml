controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    omni_wheel_controller:
      type: omni_wheel_controller/OmniWheelController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50.0

omni_wheel_controller:
  ros__parameters:
    # Three wheels for triangular omni platform
    omni_wheel_names: ['wheel1_joint', 'wheel2_joint', 'wheel3_joint']
    
    # Wheel angles (in radians)
    # wheel1: 180° (π rad) - rear
    # wheel2: -60° (-π/3 rad) - front right  
    # wheel3: 60° (π/3 rad) - front left
    omni_wheel_angle: [3.14159, -1.0472, 1.0472]
    
    # Robot dimensions
    omni_wheel_distance: 0.085  # Distance from center to wheel (chassis_radius)
    wheel_radius: 0.0508        # Wheel radius
    
    # Frame IDs
    odom_frame_id: odom
    base_frame_id: base_link
    
    # Covariance for odometry
    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
    
    # TF publishing
    enable_odom_tf: true
    
    # Command timeout
    cmd_vel_timeout: 0.5
    publish_limited_velocity: true
    use_stamped_vel: false  # Use unstamped Twist messages instead of TwistStamped
    velocity_rolling_window_size: 10
    
    # Velocity limits
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.x.max_acceleration: 0.8
    linear.x.min_acceleration: -0.8
    
    linear.y.has_velocity_limits: true
    linear.y.has_acceleration_limits: true
    linear.y.has_jerk_limits: false
    linear.y.max_velocity: 1.0
    linear.y.min_velocity: -1.0
    linear.y.max_acceleration: 0.8
    linear.y.min_acceleration: -0.8
    
    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 2.0
    angular.z.min_velocity: -2.0
    angular.z.max_acceleration: 1.5
    angular.z.min_acceleration: -1.5
